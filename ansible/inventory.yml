all:
  children:
    bastion:
      hosts:
        bastion-host:
          ansible_host: "{{ bastion_ip }}"
          ansible_user: ubuntu
          ansible_ssh_private_key_file: "{{ private_key_path }}"
    monitoring:
      hosts:
        monitoring-host:
          ansible_host: "{{ monitoring_ip }}"
          ansible_user: ubuntu
          ansible_ssh_private_key_file: "{{ private_key_path }}"
          ansible_ssh_common_args: "-o ProxyCommand='ssh -W %h:%p -i {{ private_key_path }} ubuntu@{{ bastion_ip }}'"
